<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
<title id="t">AKATUWORTHY — systems for the human side of the future</title>
<desc id="d">A high-detail cyberpunk dashboard with a midnight city skyline, luminous network lines, glass interface panels, and cyan and hot pink light.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#090b18"/><stop offset=".56" stop-color="#11142b"/><stop offset="1" stop-color="#07151f"/></linearGradient>
 <linearGradient id="horizon" x1="0" x2="1"><stop stop-color="#ff3ea5" stop-opacity="0"/><stop offset=".5" stop-color="#ff3ea5" stop-opacity=".85"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#7258ff"/><stop offset="1" stop-color="#ff3ea5"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#ff3ea5" stop-opacity=".88"/><stop offset=".45" stop-color="#b42cff" stop-opacity=".28"/><stop offset="1" stop-color="#b42cff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0v36" fill="none" stroke="#46d9ff" stroke-opacity=".12"/></pattern>
 <pattern id="windows" width="22" height="26" patternUnits="userSpaceOnUse"><rect x="3" y="4" width="8" height="10" rx="1" fill="#00eaff" opacity=".65"/><rect x="15" y="4" width="4" height="10" rx="1" fill="#fd43c1" opacity=".42"/></pattern>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect width="1280" height="460" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
