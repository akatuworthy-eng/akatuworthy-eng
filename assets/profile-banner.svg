<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Akatuworthy — AI engineer and product builder</title>
  <desc id="desc">A deep navy abstract banner with violet and teal paths, introducing practical AI and human-centered software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101426"/>
      <stop offset=".55" stop-color="#17172f"/>
      <stop offset="1" stop-color="#102b35"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".27"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="40" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="url(#stroke)" opacity=".42">
    <path d="M750 360C785 260 824 235 901 226s134-6 180-88 71-80 119-97" stroke-width="2"/>
    <path d="M800 360c22-74 75-110 145-116s119-31 152-88 54-89 103-113" stroke-width="1.5"/>
    <circle cx="902" cy="226" r="6" fill="#a78bfa" stroke="none"/>
    <circle cx="1051" cy="138" r="5" fill="#5eead4" stroke="none"/>
    <circle cx="1148" cy="41" r="4" fill="#a78bfa" stroke="none"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="76" y="93" fill="#a5b4fc" font-size="16" font-weight="700" letter-spacing="4">AI ENGINEER · PRODUCT BUILDER</text>
    <text x="72" y="183" fill="#f8fafc" font-size="64" font-weight="750" letter-spacing="-2">Akatuworthy</text>
    <text x="76" y="230" fill="#cbd5e1" font-size="21">Practical AI. Thoughtful software. Real human value.</text>
    <rect x="76" y="271" width="136" height="4" rx="2" fill="url(#stroke)"/>
  </g>
</svg>