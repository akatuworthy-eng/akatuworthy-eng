<svg xmlns="http://www.w3.org/2000/svg" width="620" height="280" viewBox="0 0 620 280" role="img" aria-labelledby="t d"><title id="t">SmartReply — intelligent customer support</title><desc id="d">A cyberpunk customer-support console showing intent routing, a conversation preview, and human handoff controls.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1321"/><stop offset="1" stop-color="#151027"/></linearGradient><linearGradient id="c"><stop stop-color="#00f5ff"/><stop offset="1" stop-color="#9167ff"/></linearGradient></defs><rect width="620" height="280" rx="15" fill="url(#b)"/><rect x="1" y="1" width="618" height="278" rx="14" fill="none" stroke="#00eaff" stroke-opacity=".5"/><path d="M15 0h590a15 15 0 0 1 15 15v26H0V15A15 15 0 0 1 15 0" fill="#111c2a"/><circle cx="20" cy="20" r="4" fill="#ff4b91"/><circle cx="36" cy="20" r="4" fill="#ffc857"/><circle cx="52" cy="20" r="4" fill="#00e7bd"/><text x="76" y="24" fill="#8496a9" font-family="monospace" font-size="11">SMARTREPLY / SUPPORT CONSOLE</text><path d="M18 60h166v196H18z" fill="#0b101a" stroke="#1d3345"/><text x="31" y="83" fill="#00efff" font-family="monospace" font-size="10" letter-spacing="1">INBOX / 04</text><rect x="30" y="99" width="140" height="44" rx="5" fill="#132638" stroke="#00eaff" stroke-opacity=".65"/><circle cx="44" cy="115" r="5" fill="#ff3ea5"/><path d="M57 111h79m-79 9h54" stroke="#71859a" stroke-width="3" stroke-linecap="round"/><path d="M31 162h117m-117 26h122m-122 26h89" stroke="#293745" stroke-width="4" stroke-linecap="round"/><text x="205" y="75" fill="#9caec1" font-family="monospace" font-size="10" letter-spacing="1">CONVERSATION / #A-094</text><rect x="205" y="88" width="182" height="42" rx="8" fill="#18212e"/><text x="217" y="106" fill="#c8d5e2" font-family="system-ui,sans-serif" font-size="11">Where is my order?</text><text x="217" y="121" fill="#63758a" font-family="monospace" font-size="9">intent: order_status</text><rect x="316" y="142" width="273" height="54" rx="8" fill="#11252d" stroke="#00f5ff" stroke-opacity=".45"/><text x="329" y="162" fill="#c9f8fa" font-family="system-ui,sans-serif" font-size="11">Your order is on its way. Track it</text><text x="329" y="178" fill="#c9f8fa" font-family="system-ui,sans-serif" font-size="11">with the link in your email.</text><rect x="205" y="211" width="174" height="25" rx="4" fill="#101a26" stroke="#263b4c"/><text x="217" y="228" fill="#72889b" font-family="monospace" font-size="9">AI ASSIST / READY</text><rect x="389" y="211" width="126" height="25" rx="4" fill="#32172c" stroke="#ff3ea5" stroke-opacity=".7"/><text x="402" y="228" fill="#ff84c5" font-family="monospace" font-size="9">HUMAN HANDOFF</text><text x="18" y="266" fill="#00dce9" font-family="monospace" font-size="10" letter-spacing="2">01 / SMARTREPLY</text><text x="602" y="266" text-anchor="end" fill="#60758b" font-family="monospace" font-size="9">INTENT → ANSWER → ESCALATE</text></svg>